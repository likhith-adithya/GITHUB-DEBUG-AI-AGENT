[project]
name = "debug-ai-agent"
version = "0.1.0"
description = "Elite AI Software Architect and Interactive GitHub Auditor"
readme = "README.md"
authors = [
    { name = "DEBUG-AI-AGENT Team" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[tool.uv]
managed = true
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/.pytest_cache"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

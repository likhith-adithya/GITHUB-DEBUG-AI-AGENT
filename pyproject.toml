[project]
name = "debug-ai-agent"
version = "0.1.0"
description = "DEBUG AI AGENT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/tmp/.pytest_cache"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
